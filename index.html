<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Most Litt Party Rides</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --y: #facc15;
      --r: #ef4444;
      --g: #22c55e;
      --dark: #080808;
      --nh: 68px;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--dark);
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      padding-top: var(--nh);
    }
    a { text-decoration: none; color: inherit; }

    /* ── Navbar ── */
    #nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 999;
      height: var(--nh);
      background: rgba(8,8,8,0.93);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(250,204,21,0.15);
      transition: box-shadow 0.3s;
    }
    .nav-wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* Brand */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: cover;
    }
    .brand-fb {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--y), var(--r));
      display: none;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 1.1rem;
      color: #000;
      flex-shrink: 0;
    }
    .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
    .brand-text strong {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 1.05rem;
      background: linear-gradient(135deg, var(--y), var(--r));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand-text span {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: #9ca3af;
    }

    /* Desktop links */
    .nav-links {
      display: none;
      align-items: center;
      gap: 2px;
    }
    .nav-links a {
      font-size: 0.82rem;
      font-weight: 600;
      color: #e5e7eb;
      padding: 7px 10px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }
    .nav-links a:hover, .nav-links a.active {
      color: var(--y);
      background: rgba(250,204,21,0.10);
    }

    /* Desktop CTAs */
    .nav-cta {
      display: none;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .nav-cta .btn-sms {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--g);
      border: 1.5px solid var(--g);
      border-radius: 999px;
      padding: 8px 16px;
      transition: all 0.2s;
    }
    .nav-cta .btn-sms:hover { background: rgba(34,197,94,0.12); }
    .nav-cta .btn-book {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #000;
      background: linear-gradient(135deg, var(--y), var(--r));
      border-radius: 999px;
      padding: 8px 18px;
      transition: all 0.2s;
      box-shadow: 0 3px 14px rgba(250,204,21,0.30);
    }
    .nav-cta .btn-book:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(250,204,21,0.45);
    }

    /* Hamburger */
    .burger {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      background: none;
      border: none;
    }
    .burger span {
      display: block;
      width: 22px;
      height: 2px;
      background: var(--y);
      border-radius: 2px;
      transition: all 0.3s;
      transform-origin: center;
    }
    .burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .burger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* Mobile menu */
    .mnav {
      position: absolute;
      top: var(--nh);
      left: 0; right: 0;
      background: rgba(8,8,8,0.97);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(250,204,21,0.15);
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease;
    }
    .mnav.open { max-height: 560px; }
    .mnav-inner {
      padding: 12px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .mnav-inner a {
      display: block;
      font-size: 0.98rem;
      font-weight: 600;
      color: #e5e7eb;
      padding: 11px 14px;
      border-radius: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      transition: color 0.2s, background 0.2s;
    }
    .mnav-inner a:last-of-type { border-bottom: none; }
    .mnav-inner a:hover { color: var(--y); background: rgba(250,204,21,0.10); }
    .mnav-cta {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .mnav-cta a {
      flex: 1;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 11px 10px;
      border-radius: 999px;
      border-bottom: none !important;
    }
    .mnav-cta .ms { color: var(--g); border: 1.5px solid var(--g); }
    .mnav-cta .ms:hover { background: rgba(34,197,94,0.12); }
    .mnav-cta .mb {
      color: #000;
      background: linear-gradient(135deg, var(--y), var(--r));
      box-shadow: 0 3px 14px rgba(250,204,21,0.30);
    }

    /* Desktop breakpoint */
    @media (min-width: 900px) {
      .nav-links, .nav-cta { display: flex; }
      .burger { display: none; }
    }
  </style>
</head>
<body>

<nav id="nav">
  <div class="nav-wrap">

    <!-- Brand -->
    <a href="index.html" class="brand">
      <img src="logo.png" alt="Most Litt Party Rides" class="brand-logo"
           onerror="this.style.display='none'; document.getElementById('bfb').style.display='flex';">
      <div class="brand-fb" id="bfb">ML</div>
      <div class="brand-text">
        <strong>Most Litt</strong>
        <span>Party Rides</span>
      </div>
    </a>

    <!-- Desktop links -->
    <div class="nav-links">
      <a href="index.html" class="active">Home</a>
      <a href="#services">Services</a>
      <a href="party-bus.html">Party Bus</a>
      <a href="jet-skis.html">Jet Skis</a>
      <a href="pontoon.html">Pontoon</a>
      <a href="#events">Events</a>
      <a href="#gallery">Gallery</a>
      <a href="#safety">Safety</a>
    </div>

    <!-- Desktop CTAs -->
    <div class="nav-cta">
      <a href="sms:9108593520" class="btn-sms">📱 Text Us</a>
      <a href="https://www.mostlittpartyrides.com/book-online" target="_blank" rel="noopener" class="btn-book">Book Now</a>
    </div>

    <!-- Hamburger -->
    <button class="burger" id="burger" onclick="toggleNav()" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

  </div>

  <!-- Mobile dropdown -->
  <div class="mnav" id="mnav">
    <div class="mnav-inner">
      <a href="index.html" onclick="closeNav()">Home</a>
      <a href="#services" onclick="closeNav()">Services</a>
      <a href="party-bus.html" onclick="closeNav()">Party Bus</a>
      <a href="jet-skis.html" onclick="closeNav()">Jet Skis</a>
      <a href="pontoon.html" onclick="closeNav()">Pontoon</a>
      <a href="#events" onclick="closeNav()">Events</a>
      <a href="#gallery" onclick="closeNav()">Gallery</a>
      <a href="#safety" onclick="closeNav()">Safety</a>
      <div class="mnav-cta">
        <a href="sms:9108593520" class="ms" onclick="closeNav()">📱 Text Us</a>
        <a href="https://www.mostlittpartyrides.com/book-online" target="_blank" rel="noopener" class="mb" onclick="closeNav()">Book Now</a>
      </div>
    </div>
  </div>
</nav>

<script>
  function toggleNav() {
    var m = document.getElementById('mnav');
    var b = document.getElementById('burger');
    var open = m.classList.toggle('open');
    b.classList.toggle('open', open);
    b.setAttribute('aria-expanded', open);
  }
  function closeNav() {
    document.getElementById('mnav').classList.remove('open');
    var b = document.getElementById('burger');
    b.classList.remove('open');
    b.setAttribute('aria-expanded', false);
  }
  document.addEventListener('click', function(e) {
    if (!document.getElementById('nav').contains(e.target)) closeNav();
  });
  window.addEventListener('scroll', function() {
    document.getElementById('nav').style.boxShadow =
      window.scrollY > 10 ? '0 4px 30px rgba(0,0,0,0.6)' : 'none';
  });
</script>

</body>
</html>
